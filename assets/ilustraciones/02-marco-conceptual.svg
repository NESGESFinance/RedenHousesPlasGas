<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Marco conceptual: rutas de gestión de residuos plásticos</title>
  <desc id="desc">Diagrama comparativo que presenta reciclaje mecánico, pirólisis e incineración como rutas distintas que requieren evaluación bajo criterios comunes, sin declarar una alternativa universalmente superior.</desc>
  <rect width="1200" height="675" rx="28" fill="#f3f7f5"/><rect width="1200" height="140" rx="28" fill="#102b40"/><path d="M0 112h1200v28H0z" fill="#102b40"/>
  <text x="70" y="62" fill="#9fe6c9" font-family="Arial,sans-serif" font-size="17" letter-spacing="2">SECCIÓN 2 · MARCO TEÓRICO Y CONCEPTUAL</text>
  <text x="70" y="108" fill="#fff" font-family="Arial,sans-serif" font-size="36" font-weight="700">Comparar opciones con criterios transparentes</text>
  <rect x="440" y="172" width="320" height="76" rx="18" fill="#e2f5ee" stroke="#35a987" stroke-width="2"/><text x="600" y="205" text-anchor="middle" fill="#164c43" font-family="Arial,sans-serif" font-size="18" font-weight="700">RESIDUOS PLÁSTICOS</text><text x="600" y="230" text-anchor="middle" fill="#39756a" font-family="Arial,sans-serif" font-size="15">caracterizados y según aceptación</text>
  <path d="M600 248v31M600 279H220v30M600 279v30M600 279h380v30" fill="none" stroke="#78949a" stroke-width="3"/>
  <g font-family="Arial,sans-serif">
    <rect x="65" y="309" width="310" height="175" rx="20" fill="#fff" stroke="#4b93b0" stroke-width="3"/><circle cx="220" cy="355" r="24" fill="#e7f5fa"/><path d="M207 355h26m-8-8 8 8-8 8" fill="none" stroke="#327b98" stroke-width="3"/><text x="220" y="405" text-anchor="middle" fill="#16374a" font-size="22" font-weight="700">Reciclaje mecánico</text><text x="220" y="438" text-anchor="middle" fill="#58717a" font-size="15">Reprocesamiento material</text><text x="220" y="461" text-anchor="middle" fill="#58717a" font-size="15">según tipo y calidad del residuo</text>
    <rect x="445" y="309" width="310" height="175" rx="20" fill="#fff" stroke="#35a987" stroke-width="3"/><circle cx="600" cy="355" r="24" fill="#e2f5ee"/><path d="M600 337c-13 18-13 25 0 31 13-6 13-13 0-31zm0 20v17" fill="none" stroke="#22856d" stroke-width="3"/><text x="600" y="405" text-anchor="middle" fill="#164c43" font-size="22" font-weight="700">Pirólisis</text><text x="600" y="438" text-anchor="middle" fill="#58717a" font-size="15">Conversión térmica conceptual</text><text x="600" y="461" text-anchor="middle" fill="#58717a" font-size="15">productos y riesgos por caracterizar</text>
    <rect x="825" y="309" width="310" height="175" rx="20" fill="#fff" stroke="#d59b54" stroke-width="3"/><circle cx="980" cy="355" r="24" fill="#fff3e1"/><path d="M980 335c-14 16-11 23-5 26-1-8 7-10 7-17 8 8 12 16 6 24-10 12-29 1-24-12" fill="none" stroke="#aa7131" stroke-width="3"/><text x="980" y="405" text-anchor="middle" fill="#5a4123" font-size="22" font-weight="700">Incineración</text><text x="980" y="438" text-anchor="middle" fill="#58717a" font-size="15">Tratamiento térmico distinto</text><text x="980" y="461" text-anchor="middle" fill="#58717a" font-size="15">con impactos y controles propios</text>
  </g>
  <text x="600" y="530" text-anchor="middle" fill="#31515a" font-family="Arial,sans-serif" font-size="18" font-weight="700">Evaluar en todos los casos</text>
  <g font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><rect x="83" y="550" width="240" height="47" rx="23" fill="#e5eeef"/><text x="203" y="580" fill="#31515a">Calidad y destino del material</text><rect x="348" y="550" width="240" height="47" rx="23" fill="#e5eeef"/><text x="468" y="580" fill="#31515a">Balance y límites del sistema</text><rect x="613" y="550" width="240" height="47" rx="23" fill="#e5eeef"/><text x="733" y="580" fill="#31515a">Impactos y emisiones</text><rect x="878" y="550" width="240" height="47" rx="23" fill="#e5eeef"/><text x="998" y="580" fill="#31515a">Costos y normativa local</text></g>
  <text x="70" y="640" fill="#74888c" font-family="Arial,sans-serif" font-size="14">Esquema educativo: la opción apropiada depende de evidencia, contexto, regulación y evaluación del ciclo de vida.</text>
</svg>
