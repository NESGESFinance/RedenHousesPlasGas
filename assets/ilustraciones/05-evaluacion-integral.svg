<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Evaluación integral del proyecto</title>
  <desc id="desc">Cuatro dimensiones conectadas para evaluar el proyecto: técnica, ambiental, social y económica, apoyadas por evidencia, regulación y análisis de incertidumbre.</desc>
  <rect width="1200" height="675" rx="28" fill="#f3f7f5"/><text x="70" y="62" fill="#27866f" font-family="Arial,sans-serif" font-size="17" letter-spacing="2">EVALUACIÓN DEL PROYECTO</text><text x="70" y="112" fill="#102b40" font-family="Arial,sans-serif" font-size="36" font-weight="700">Una decisión informada requiere cuatro miradas</text>
  <circle cx="600" cy="355" r="119" fill="#102b40"/><circle cx="600" cy="355" r="100" fill="none" stroke="#53c5a0" stroke-width="3" stroke-dasharray="8 8"/><text x="600" y="344" text-anchor="middle" fill="#9fe6c9" font-family="Arial,sans-serif" font-size="16" letter-spacing="1">EVIDENCIA</text><text x="600" y="380" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Proyecto</text>
  <g font-family="Arial,sans-serif">
    <path d="M512 279 385 206M688 279l127-73M512 431l-127 73M688 431l127 73" stroke="#7aa49b" stroke-width="3"/>
    <rect x="90" y="150" width="300" height="125" rx="20" fill="#e3f2f7" stroke="#4e91aa" stroke-width="2"/><text x="125" y="191" fill="#276b83" font-size="16" font-weight="700">01 · TÉCNICA</text><text x="125" y="226" fill="#16374a" font-size="19">Capacidad, calidad, balances</text><text x="125" y="252" fill="#58717a" font-size="15">y servicios requeridos</text>
    <rect x="810" y="150" width="300" height="125" rx="20" fill="#e4f4eb" stroke="#46a27c" stroke-width="2"/><text x="845" y="191" fill="#287a59" font-size="16" font-weight="700">02 · AMBIENTAL</text><text x="845" y="226" fill="#16374a" font-size="19">Emisiones, efluentes, ciclo</text><text x="845" y="252" fill="#58717a" font-size="15">de vida e impactos</text>
    <rect x="90" y="440" width="300" height="125" rx="20" fill="#fff1e0" stroke="#d59b54" stroke-width="2"/><text x="125" y="481" fill="#a26d2e" font-size="16" font-weight="700">03 · SOCIAL</text><text x="125" y="516" fill="#16374a" font-size="19">Participación, empleo, salud</text><text x="125" y="542" fill="#58717a" font-size="15">y contexto local</text>
    <rect x="810" y="440" width="300" height="125" rx="20" fill="#eeeafb" stroke="#8b7cc1" stroke-width="2"/><text x="845" y="481" fill="#6e5ca7" font-size="16" font-weight="700">04 · ECONÓMICA</text><text x="845" y="516" fill="#16374a" font-size="19">Inversión, costos, ingresos</text><text x="845" y="542" fill="#58717a" font-size="15">y sensibilidad</text>
  </g>
  <rect x="260" y="597" width="680" height="44" rx="22" fill="#dfe9e8"/><text x="600" y="625" text-anchor="middle" fill="#31515a" font-family="Arial,sans-serif" font-size="16">Fuentes · metodología · incertidumbre · permisos aplicables</text>
</svg>
