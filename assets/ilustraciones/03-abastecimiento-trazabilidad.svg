<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Abastecimiento, preparación y trazabilidad de residuos</title>
  <desc id="desc">Cadena conceptual desde fuentes de residuos hasta recepción, verificación, preparación y registro trazable, destacando que la aceptación depende de criterios definidos.</desc>
  <rect width="1200" height="675" rx="28" fill="#f7f8f2"/><text x="68" y="62" fill="#27866f" font-family="Arial,sans-serif" font-size="17" letter-spacing="2">SECCIÓN 3 · MATERIA PRIMA Y GESTIÓN</text><text x="68" y="112" fill="#102b40" font-family="Arial,sans-serif" font-size="36" font-weight="700">De la fuente al registro verificable</text><text x="68" y="150" fill="#5e7478" font-family="Arial,sans-serif" font-size="18">Cada lote requiere información, control de calidad y una ruta documentada.</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#37a889"/></marker></defs>
  <path d="M220 310h95m155 0h95m155 0h95m155 0h95" fill="none" stroke="#37a889" stroke-width="4" marker-end="url(#a)"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(145 310)"><circle r="67" fill="#e5f4ed" stroke="#37a889" stroke-width="3"/><path d="M-25 8h50l-7 31h-36zM-19-3h38V8h-38zM-11-18h22v15h-22z" fill="none" stroke="#237d67" stroke-width="3"/><text y="105" fill="#173d3c" font-size="19" font-weight="700">Fuentes</text><text y="131" fill="#617579" font-size="15">Municipios · comercios</text><text y="153" fill="#617579" font-size="15">· recicladores</text></g>
    <g transform="translate(375 310)"><circle r="67" fill="#e9f2f7" stroke="#548ead" stroke-width="3"/><path d="M-27-19h54v49h-54zM-17-7h34M-17 5h34M-17 17h20" fill="none" stroke="#326c8a" stroke-width="3"/><text y="105" fill="#173d3c" font-size="19" font-weight="700">Recepción</text><text y="131" fill="#617579" font-size="15">Origen · lote · volumen</text><text y="153" fill="#617579" font-size="15">· documentación</text></g>
    <g transform="translate(605 310)"><circle r="67" fill="#fff2df" stroke="#d39b51" stroke-width="3"/><path d="M-26 20l15-18 12 11 25-30M-25 29h50" fill="none" stroke="#a97735" stroke-width="4"/><text y="105" fill="#173d3c" font-size="19" font-weight="700">Verificación</text><text y="131" fill="#617579" font-size="15">Clasificación y criterios</text><text y="153" fill="#617579" font-size="15">de aceptación</text></g>
    <g transform="translate(835 310)"><circle r="67" fill="#e5f4ed" stroke="#37a889" stroke-width="3"/><path d="M-27-20h54v13h-54zM-22-7v35h44V-7M-10 7h20M-10 18h20" fill="none" stroke="#237d67" stroke-width="3"/><text y="105" fill="#173d3c" font-size="19" font-weight="700">Preparación</text><text y="131" fill="#617579" font-size="15">Acondicionamiento</text><text y="153" fill="#617579" font-size="15">según especificación</text></g>
    <g transform="translate(1065 310)"><circle r="67" fill="#eeeafb" stroke="#8b7cc1" stroke-width="3"/><path d="M-23-26h31l16 16v36h-47zM8-26v17h16M-13 2h25M-13 14h25" fill="none" stroke="#6e5ca7" stroke-width="3"/><text y="105" fill="#173d3c" font-size="19" font-weight="700">Trazabilidad</text><text y="131" fill="#617579" font-size="15">Registros y seguimiento</text><text y="153" fill="#617579" font-size="15">de la cadena</text></g>
  </g>
  <rect x="95" y="535" width="1010" height="72" rx="18" fill="#102b40"/><text x="600" y="565" text-anchor="middle" fill="#a9e8d2" font-family="Arial,sans-serif" font-size="16" font-weight="700">REGISTRO ÚTIL = DATOS CONSISTENTES + RESPONSABLES + AUDITORÍA</text><text x="600" y="590" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="16">Blockchain es una opción de registro; no sustituye la verificación de los datos de origen.</text>
  <text x="68" y="646" fill="#74888c" font-family="Arial,sans-serif" font-size="14">Diagrama conceptual; no fija criterios de aceptación ni instrucciones de procesamiento.</text>
