<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Flujo conceptual de valorización mediante pirólisis</title>
  <desc id="desc">Diagrama de alto nivel desde la materia prima verificada, su preparación y conversión conceptual, hasta corrientes de salida que deben caracterizarse y evaluarse conforme a regulación y seguridad.</desc>
  <rect width="1200" height="675" rx="28" fill="#102b40"/><text x="70" y="63" fill="#9fe6c9" font-family="Arial,sans-serif" font-size="17" letter-spacing="2">SECCIÓN 4 · PROCESO TÉCNICO Y OPERATIVO</text><text x="70" y="115" fill="#fff" font-family="Arial,sans-serif" font-size="36" font-weight="700">Flujo conceptual, sin parámetros de diseño</text><text x="70" y="151" fill="#c4d6dc" font-family="Arial,sans-serif" font-size="18">La ingeniería, la seguridad y los permisos requieren evaluación específica del proyecto.</text>
  <defs><marker id="flow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#55d6ad"/></marker></defs>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="65" y="235" width="210" height="128" rx="18" fill="#173d4d" stroke="#6d9fac" stroke-width="2"/><text x="170" y="278" fill="#a7e8d3" font-size="16" font-weight="700">ENTRADA</text><text x="170" y="314" fill="#fff" font-size="19">Residuo verificado</text><text x="170" y="341" fill="#c4d6dc" font-size="14">lote y características</text>
    <rect x="335" y="235" width="210" height="128" rx="18" fill="#173d4d" stroke="#6d9fac" stroke-width="2"/><text x="440" y="278" fill="#a7e8d3" font-size="16" font-weight="700">PREPARACIÓN</text><text x="440" y="314" fill="#fff" font-size="19">Acondicionamiento</text><text x="440" y="341" fill="#c4d6dc" font-size="14">según diseño validado</text>
    <rect x="605" y="220" width="245" height="158" rx="20" fill="#185a55" stroke="#55d6ad" stroke-width="3"/><text x="727" y="268" fill="#a7f0d7" font-size="16" font-weight="700">CONVERSIÓN</text><text x="727" y="308" fill="#fff" font-size="23" font-weight="700">Pirólisis</text><text x="727" y="341" fill="#c4e6df" font-size="15">representación conceptual</text>
    <rect x="910" y="235" width="225" height="128" rx="18" fill="#173d4d" stroke="#6d9fac" stroke-width="2"/><text x="1022" y="278" fill="#a7e8d3" font-size="16" font-weight="700">CARACTERIZACIÓN</text><text x="1022" y="314" fill="#fff" font-size="19">Corrientes de salida</text><text x="1022" y="341" fill="#c4d6dc" font-size="14">calidad y cumplimiento</text>
  </g>
  <path d="M275 299h50m220 0h50m255 0h50" stroke="#55d6ad" stroke-width="4" marker-end="url(#flow)"/>
  <path d="M1022 363v45m-120 0h240m-240 0v34m120-34v34m120-34v34" fill="none" stroke="#55d6ad" stroke-width="3"/>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="825" y="442" width="180" height="70" rx="15" fill="#234456"/><text x="915" y="472" fill="#fff" font-size="16">Fracción(es)</text><text x="915" y="494" fill="#c4d6dc" font-size="13">por analizar</text><rect x="1012" y="442" width="180" height="70" rx="15" fill="#234456"/><text x="1102" y="472" fill="#fff" font-size="16">Residuos y</text><text x="1102" y="494" fill="#c4d6dc" font-size="13">emisiones a gestionar</text><rect x="625" y="442" width="180" height="70" rx="15" fill="#234456"/><text x="715" y="472" fill="#fff" font-size="16">Usos potenciales</text><text x="715" y="494" fill="#c4d6dc" font-size="13">sujetos a especificación</text></g>
  <rect x="65" y="548" width="1070" height="61" rx="16" fill="#f4ad5b"/><text x="600" y="585" text-anchor="middle" fill="#402d17" font-family="Arial,sans-serif" font-size="18" font-weight="700">Controles, balance, seguridad y permisos deben documentarse para el caso real.</text>
  <text x="70" y="645" fill="#a9c5d0" font-family="Arial,sans-serif" font-size="14">Esquema informativo únicamente: no es P&amp;ID, ingeniería, protocolo de operación ni garantía de rendimiento.</text>
</svg>
